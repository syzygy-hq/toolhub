name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # next build type-checks the whole project itself; a standalone `tsc
      # --noEmit` here would fail because Next's route types (LayoutProps,
      # PageProps, etc.) are only generated during build/dev.
      - run: npm run build
